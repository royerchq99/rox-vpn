# WireGuard para Roger, con wg-easy.
#
# NO hay ningun secreto en este archivo, y por eso el repo puede ser publico:
# EasyPanel solo lee el .env del repo para un compose (las variables que se ponen
# en su pantalla NO llegan a la sustitucion ${...}, comprobado el 07/10), asi que
# aqui no se usa ninguna variable.
#
# El panel web va SIN contrasena a proposito, y es seguro porque **solo escucha
# dentro del servidor** (127.0.0.1): desde internet no se llega. Para abrirlo se
# hace un tunel: ssh -L 51821:127.0.0.1:51821 jarvis@2.24.65.16
# Lo unico abierto a internet es el 51820/UDP, que es la VPN en si y se protege
# con sus propias llaves, no con contrasena.
services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    restart: unless-stopped
    environment:
      - WG_HOST=2.24.65.16
      - WG_PORT=51820
      - WG_DEFAULT_DNS=1.1.1.1
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_ALLOWED_IPS=0.0.0.0/0, ::/0
      - UI_TRAFFIC_STATS=true
      - LANG=es
      # Las cuatro primeras son las que trae wg-easy de serie (NAT y reenvio): si se
      # define WG_POST_UP hay que repetirlas o la VPN deja de dar internet.
      # La ULTIMA es la que se anade: cierra el panel de administracion desde DENTRO
      # del tunel. Sin ella, quien tuviera un perfil .conf podria abrir
      # http://10.8.0.1:51821 y crearse mas accesos, porque el panel no pide clave.
      - WG_POST_UP=iptables -t nat -A POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASQUERADE; iptables -A INPUT -p udp -m udp --dport 51820 -j ACCEPT; iptables -A FORWARD -i wg0 -j ACCEPT; iptables -A FORWARD -o wg0 -j ACCEPT; iptables -I INPUT 1 -i wg0 -p tcp --dport 51821 -j REJECT
      - WG_POST_DOWN=iptables -t nat -D POSTROUTING -s 10.8.0.0/24 -o eth0 -j MASQUERADE; iptables -D INPUT -p udp -m udp --dport 51820 -j ACCEPT; iptables -D FORWARD -i wg0 -j ACCEPT; iptables -D FORWARD -o wg0 -j ACCEPT; iptables -D INPUT -i wg0 -p tcp --dport 51821 -j REJECT
    volumes:
      - wg-datos:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "127.0.0.1:51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1

volumes:
  wg-datos:
