# WireGuard para Roger, con wg-easy (interfaz web y codigos QR).
#
# Por que como "compose" y no como app normal de EasyPanel: una VPN necesita
# permisos de red que el tipo "app" no deja poner (NET_ADMIN para levantar el
# tunel, y dos ajustes del nucleo para que reenvie el trafico). Aqui si caben.
#
# El panel web NO se publica al mundo: solo escucha en el propio servidor y se
# llega por el dominio con HTTPS que pone EasyPanel delante. Lo unico abierto a
# internet es el 51820/UDP, que es por donde entra la VPN.
services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: rox-vpn
    restart: unless-stopped
    environment:
      - WG_HOST=${WG_HOST}
      - PASSWORD=${PASSWORD}
      - WG_PORT=51820
      - WG_DEFAULT_DNS=${WG_DEFAULT_DNS:-1.1.1.1}
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_ALLOWED_IPS=0.0.0.0/0, ::/0
      - UI_TRAFFIC_STATS=true
      - UI_CHART_TYPE=2
      - LANG=es
    volumes:
      - wg-datos:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "127.0.0.1:51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1

volumes:
  wg-datos:
