# WireGuard para Roger, con wg-easy.
#
# NO hay ningun secreto en este archivo, y por eso el repo puede ser publico:
# EasyPanel solo lee el .env del repo para un compose (las variables que se ponen
# en su pantalla NO llegan a la sustitucion ${...}, comprobado el 07/10), asi que
# aqui no se usa ninguna variable.
#
# El panel web va SIN contrasena a proposito, y es seguro porque **solo escucha
# dentro del servidor** (127.0.0.1): desde internet no se llega. Para abrirlo se
# hace un tunel: ssh -L 51821:127.0.0.1:51821 jarvis@2.24.65.16
# Lo unico abierto a internet es el 51820/UDP, que es la VPN en si y se protege
# con sus propias llaves, no con contrasena.
services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    restart: unless-stopped
    environment:
      - WG_HOST=2.24.65.16
      - WG_PORT=51820
      - WG_DEFAULT_DNS=1.1.1.1
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_ALLOWED_IPS=0.0.0.0/0, ::/0
      - UI_TRAFFIC_STATS=true
      - LANG=es
    volumes:
      - wg-datos:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "127.0.0.1:51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1

volumes:
  wg-datos:
